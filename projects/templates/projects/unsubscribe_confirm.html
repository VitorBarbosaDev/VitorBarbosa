{% extends "projects/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-8 col-lg-6">
            <h1><i class="fas fa-check-circle"></i> Unsubscribed</h1>
            <p class="mt-3">
                You have been successfully unsubscribed and will no longer
                receive email notifications for new blog posts.
            </p>
            <p class="text-muted-light">
                Changed your mind? You can always
                <a href="{% url 'subscribe' %}" class="text-accent">subscribe again</a>.
            </p>
        </div>
    </div>
</div>
{% endblock content %}
